name: Require controller version label

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
    branches: [main]

jobs:
  validate-version-label:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Validate exactly one controller version label
        id: validate
        shell: bash
        run: |
          LABELS="$(jq -r '.pull_request.labels[].name // empty' "$GITHUB_EVENT_PATH")"
          COUNT=0

          while IFS= read -r LABEL; do
            case "$LABEL" in
              version:major|version:minor|version:patch|version:no_bump)
                COUNT=$((COUNT+1))
                ;;
            esac
          done <<< "$LABELS"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 1 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain invalid version labels
        if: steps.validate.outputs.valid == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const count = Number("${{ steps.validate.outputs.count }}");
            const problem = count === 0
              ? "This pull request has no controller version label."
              : `This pull request has ${count} controller version labels.`;
            const body = `${problem}\n\nAdd exactly one of:\n\n` +
              "- `version:major`\n" +
              "- `version:minor`\n" +
              "- `version:patch`\n" +
              "- `version:no_bump`\n\n" +
              "The post-merge controller release cannot run without one unambiguous label.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail for invalid version labels
        if: steps.validate.outputs.valid == 'false'
        run: |
          echo "Expected exactly one controller version label."
          exit 1
