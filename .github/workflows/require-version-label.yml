name: Validate release metadata

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened, ready_for_review]
    branches: [main]

jobs:
  validate-release-metadata:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release validation tools
        uses: actions/checkout@v4

      - name: Validate release-label selection and component notes
        env:
          EVENT_PATH: ${{ github.event_path }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/release-metadata
        run: |
          python tools/release_metadata.py \
            --event-path "$EVENT_PATH" \
            --output-directory "$OUTPUT_DIRECTORY"
