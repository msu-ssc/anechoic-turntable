repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.0
      hooks:
          # Run lint fixes before formatting so import sorting settles first.
          - id: ruff-check
            args: [--fix, --exit-non-zero-on-fix]
          - id: ruff-format
            args: [--exit-non-zero-on-fix]
