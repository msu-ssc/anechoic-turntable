[project]
name = "anechoic-turntable"
version = "0.1.0"
description = "Python controller and firmware for the MSU anechoic chamber turntable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.6",
    "pyserial>=3.5",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# typing.Self is unavailable on the oldest supported Python version.
ignore = ["PYI034"]
