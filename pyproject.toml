[project]
name = "anechoic-turntable"
dynamic = ["version"]
description = "Python controller and firmware for the MSU anechoic chamber turntable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.6",
    "pyserial>=3.5",
    "textual>=1.0",
    "typing-extensions>=4.16.0",
]

[project.scripts]
anechoic-turntable-tui = "anechoic_turntable.tui:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/anechoic_turntable/_version.py"
pattern = 'CONTROLLER_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/anechoic_turntable"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.3.4",
    "ruff",
]

[tool.ruff]
line-length = 320 # This is the biggest number Ruff will accept.
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "F541",   # f-string without any placeholders
    "E501",   # line too long
]

extend-select = [
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
force-single-line = true
